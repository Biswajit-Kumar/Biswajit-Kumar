name: generate contribution snake
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: generate snake svg
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: Biswajit-Kumar
          outputs: |
            dist/snake.svg?color_snake=%238A2BE2&color_dots=%23161b22,%232d1b4e,%234b2e83,%237b3fe4,%2300cfff
            dist/snake-dark.svg?palette=github-dark&color_snake=%2300cfff

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
